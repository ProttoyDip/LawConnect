version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: 'LawConnect'
        APP_ENV: 'local'
        APP_KEY: 'base64:your-app-key-here-generate-with-artisan-key-generate'
        APP_DEBUG: 'true'
        APP_URL: 'http://localhost'
        FRONTEND_URL: 'http://localhost:5173'
        LOG_LEVEL: 'debug'
        DB_CONNECTION: 'mysql'
        DB_HOST: 'db'
        DB_PORT: '3306'
        DB_DATABASE: 'lawconnect'
        DB_USERNAME: 'root'
        DB_PASSWORD: 'root123'
    ports:
      - '8000:80'
    depends_on:
      - db
    volumes:
      - ./server:/var/www/html
      - ./client:/var/www/html/client

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: lawconnect
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root123
      PMA_ABSOLUTE_URI: http://127.0.0.1:8080/
    ports:
      - '8080:80'

volumes:
  mysql_data:
